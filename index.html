<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>受限访问</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#FAF9F6;color:#161514;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.7;
  display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:392px;background:#fff;
  border:1px solid #E6E2DA;border-radius:16px;
  padding:46px 40px 34px;position:relative;
  box-shadow:0 1px 2px rgba(22,21,20,.03);
}
.card::before{
  content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:46px;height:3px;background:#B83348;border-radius:0 0 3px 3px;
}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.sub{font-size:13.5px;color:#8C8880;margin-bottom:30px;line-height:1.65}
form{display:flex;flex-direction:column;gap:12px}
input{
  width:100%;height:54px;border:1px solid #E6E2DA;border-radius:9px;
  background:#FAF9F6;font-size:22px;letter-spacing:.5em;text-indent:.5em;
  text-align:center;color:#161514;outline:none;
  font-family:"SFMono-Regular",Consolas,monospace;
  transition:border-color .15s,background .15s;
}
input::placeholder{letter-spacing:0;text-indent:0;font-size:14px;color:#B8B3AA;font-family:inherit}
input:focus{border-color:#B83348;background:#fff}
input:disabled{opacity:.5}
button{
  width:100%;height:48px;border:none;border-radius:9px;
  background:#161514;color:#fff;font-size:14.5px;font-weight:500;
  cursor:pointer;letter-spacing:.04em;font-family:inherit;
  transition:opacity .15s;
}
button:hover:not(:disabled){opacity:.85}
button:disabled{opacity:.4;cursor:not-allowed}
.err{
  font-size:12.5px;color:#AE322C;height:18px;margin-top:12px;
  text-align:center;transition:opacity .2s;opacity:0;
}
.err.on{opacity:1}
.hint{
  font-size:11.5px;color:#B8B3AA;text-align:center;margin-top:22px;
  padding-top:18px;border-top:1px solid #F1EEE8;line-height:1.6;
}
.loading{display:none;text-align:center;font-size:13px;color:#8C8880;margin-top:14px}
.loading.on{display:block}
@media (max-width:420px){
  .card{padding:36px 26px 28px;border-radius:14px}
  h1{font-size:18px}
  input{height:50px;font-size:20px}
}
</style>
</head>
<body>

<div class="card" id="card">
  <h1>受限访问</h1>
  <p class="sub">此文档已加密，需要访问密码才能查看。</p>
  <form id="form" autocomplete="off">
    <input id="pwd" type="password" inputmode="numeric" maxlength="12" placeholder="请输入访问密码" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" id="btn">进入</button>
  </form>
  <p class="err" id="err"></p>
  <div class="loading" id="loading">正在解密…</div>
  <p class="hint">正文以 AES-256-GCM 加密存储<br>密码不存放于任何位置</p>
</div>

<script src="payload.js"></script>
<script>
(function(){
  var P = window.__P;
  var form = document.getElementById('form');
  var pwd  = document.getElementById('pwd');
  var btn  = document.getElementById('btn');
  var err  = document.getElementById('err');
  var card = document.getElementById('card');
  var load = document.getElementById('loading');
  var fails = 0, locked = false;

  if (!P) { show('资源加载失败，请刷新页面重试'); return; }

  if (!window.crypto || !window.crypto.subtle) {
    show('当前环境不支持解密。请通过 https 访问（直接双击本地文件无效）。');
    btn.disabled = true;
    return;
  }

  var cached = sessionStorage.getItem('__doc');
  if (cached) { render(cached); return; }

  pwd.focus();

  function show(msg){
    err.textContent = msg || '';
    err.classList.toggle('on', !!msg);
  }

  function b64(s){
    var bin = atob(s), len = bin.length, out = new Uint8Array(len);
    for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function deriveKey(pass, salt, iter){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['decrypt']
        );
      });
  }

  function render(html){
    try {
      document.open();
      document.write(html);
      document.close();
    } catch(e) {
      document.body.innerHTML = '<p style="font:14px sans-serif;color:#AE322C;text-align:center">渲染失败，请刷新重试</p>';
    }
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (locked) return;
    var pass = pwd.value;
    if (!pass) { show('请输入密码'); return; }

    show('');
    btn.disabled = true;
    btn.textContent = '校验中…';

    deriveKey(pass, b64(P.s), P.n)
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.i) }, key, b64(P.d));
      })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        try { sessionStorage.setItem('__doc', html); } catch(err){}
        load.classList.add('on');
        render(html);
      })
      .catch(function(){
        fails++;
        btn.disabled = false;
        btn.textContent = '进入';
        pwd.value = '';
        pwd.focus();

        if (fails >= 3) {
          locked = true;
          var wait = 10;
          btn.disabled = true;
          show('尝试次数过多，请等待 ' + wait + ' 秒');
          var t = setInterval(function(){
            wait--;
            if (wait <= 0) {
              clearInterval(t);
              locked = false;
              btn.disabled = false;
              show('');
            } else {
              show('尝试次数过多，请等待 ' + wait + ' 秒');
            }
          }, 1000);
        } else {
          show('密码不正确，还可尝试 ' + (3 - fails) + ' 次');
        }
      });
  });

  pwd.addEventListener('input', function(){ if (err.classList.contains('on')) show(''); });
})();
</script>
</body>
</html>
